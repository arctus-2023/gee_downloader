### Cloud-native STAC download configuration tailored for AWS Earth Search + Planetary Computer fallbacks.
[GLOBAL]
# AOI is used to compute the bounding box for all STAC searches.
aoi = ./test_aoi.geojson
start_date = 2025-10-01
end_date = 2025-10-05
assets = S2_L1TOA, S2_L2RGB, S2_L2SURF, LC08_L1TOA, LC08_L2RGB, S1_L1C
target = all
# Applies to the asset's metadata when available; we assume the optical bands are mostly clear-water.
cloud_percentage = 30
# Local staging area for non-L1 outputs; L1 folder always lands on ADLS via the configured prefix.
save_dir = ./downloads

[S2_L1TOA]
include_bands = B01,B02,B03,B04,B05,B06,B07,B08,B8A,B09,B10,B11,B12,QA60
resolution = 10
save_dir = L1
anonym = s2_msi

[S2_L2RGB]
include_bands = TCI_R,TCI_G,TCI_B
resolution = 10
save_dir = L2RGB
anonym = s2_msi

[S2_L2SURF]
include_bands = B01,B02,B03,B04,B05,B06,B07,B08,B8A,B09,B11,B12
resolution = 10
save_dir = L2_SURF
anonym = s2_msi

[LC08_L1TOA]
include_bands = B1,B2,B3,B4,B5,B6,B7,B8,B9,B10,B11,QA_PIXEL,QA_RADSAT,SAA,SZA,VAA,VZA
resolution = 30
save_dir = L1
anonym = l8_oli

[LC08_L2RGB]
include_bands = SR_B4,SR_B3,SR_B2
resolution = 30
save_dir = L2RGB
anonym = l8_oli

[S1_L1C]
include_bands = HH,HV,VV,VH
resolution = 10
save_dir = L1
anonym = s1_sar

[OVERRIDE]
# Optional manual overrides per dataset band.
# Format: DATASET_BAND = asset_name[,fallback_asset]
# Example: LC08_L1TOA_B8 = nir08
