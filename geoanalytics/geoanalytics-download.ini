### Cloud-native STAC download configuration tailored for AWS Earth Search + Planetary Computer fallbacks.
[GLOBAL]
# AOI is used to compute the bounding box for all STAC searches.
aoi = abfs://01j9ajb2mdvmnkyhpahfevcy2t-sageport-main/R-15-D.geojson
clip_to_aoi = true
start_date = 2025-10-01
end_date = 2025-10-02

assets = S1_L1C
; assets = S2_L1TOA, S2_L2RGB, S2_L2SURF, S1_L1C, LC08_L1TOA, LC08_L2RGB, LC09_L1TOA, LC09_L2RGB


target = all
# Applies to the asset's metadata when available; we assume the optical bands are mostly clear-water.
cloud_percentage = 30
# Local staging area for non-L1 outputs; L1 folder always lands on ADLS via the configured prefix.
save_dir = ./downloads
# Comma-delimited list of default STAC endpoints searched in order for each asset section.
stac_endpoints = https://earth-search.aws.element84.com/v1, https://planetarycomputer.microsoft.com/api/stac/v1

# =============================================================================
# Merge Configuration
# =============================================================================
# When true, downloads bands to temp directory and merges into single output file
# Can be overridden per-section with merge_outputs = true/false
merge_outputs = false

# Optional: specify a custom temp directory for downloads before merging (default: system temp)
# temp_download_dir = /tmp/geoanalytics_downloads

# Output format for merged files: "cog" (Cloud Optimized GeoTIFF) or "zarr"
# COG is best for traditional GIS workflows and broad compatibility
# Zarr is best for cloud-native analytics, parallel access, and large datasets
# Can be overridden per-section with output_format = cog/zarr
output_format = cog

# Zarr-specific settings (only used when output_format = zarr)
# Chunk sizes as bands,height,width - controls how data is partitioned for parallel access
# Smaller chunks = better for random access, larger chunks = better for sequential reads
zarr_chunks = 1,512,512

# =============================================================================
# Hierarchical Zarr Mode (Advanced)
# =============================================================================
# When true, creates a SINGLE Zarr store with groups for each scene/date:
#   <collection>.zarr/
#     ├── 20250103/
#     │   ├── bands/          # Individual band arrays
#     │   │   ├── blue/
#     │   │   ├── green/
#     │   │   └── ...
#     │   └── merged/         # Stacked multi-band array
#     ├── 20250104/
#     │   ├── bands/
#     │   └── merged/
#     └── ...
#
# Benefits:
#   - Single store to manage instead of hundreds of separate files
#   - Supports incremental updates (add new dates without rewriting)
#   - Both raw bands and merged data available
#   - Cloud-efficient with fewer API calls
#
# Set to true to enable hierarchical mode (requires output_format = zarr)
hierarchical_zarr = true

# When hierarchical_zarr = true, whether to write individual bands
# Set to false to only write the merged array (saves storage space)
write_individual_bands = true

# Optional: explicit path for the Zarr store (if not set, derived from save_dir)
# zarr_store_path = abfs://container/path/to/collection.zarr

