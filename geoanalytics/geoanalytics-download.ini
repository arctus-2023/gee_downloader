### Cloud-native STAC download configuration tailored for AWS Earth Search + Planetary Computer fallbacks.
[GLOBAL]
# AOI is used to compute the bounding box for all STAC searches.
aoi = /media/thomas/Arctus_data2/0_Arctus_Project/30_Eeyou_IZMAPPING/AOI/isea3h_12_aoi_intertidal_limit_5_tiles.shp
clip_to_aoi = true
start_date = 2025-08-01
end_date = 2025-08-15
# Output mode: "local" or "cloud"
output_mode = local
assets = S2_L2RGB
; assets = S2_L1TOA, S2_L2RGB, S2_L2SURF, S1_L1C, LC08_L1TOA, LC08_L2RGB, LC09_L1TOA, LC09_L2RGB


target = all
# Applies to the asset's metadata when available; we assume the optical bands are mostly clear-water.
cloud_percentage = 80
# Local staging area for non-L1 outputs; L1 folder always lands on ADLS via the configured prefix.
save_dir = /media/thomas/Arctus_data2/0_Arctus_Project/30_Eeyou_IZMAPPING/data/gee_l1_otherbands/
# Comma-delimited list of default STAC endpoints searched in order for each asset section.
stac_endpoints = https://earth-search.aws.element84.com/v1, https://planetarycomputer.microsoft.com/api/stac/v1

# =============================================================================
# Merge Configuration
# =============================================================================
# When true, downloads bands to temp directory and merges into single output file
# Can be overridden per-section with merge_outputs = true/false
merge_outputs = true

# Optional: specify a custom temp directory for downloads before merging (default: system temp)
# temp_download_dir = /tmp/geoanalytics_downloads

# Output format for merged files.
# Currently only "cog" (Cloud Optimized GeoTIFF) is supported.
# Can be overridden per-section with output_format = cog
output_format = cog

[S2_L1TOA]
include_bands = B01,B02,B03,B04,B05,B06,B07,B08,B8A,B09,B10,B11,B12,QA60
stac_endpoints = https://earth-search.aws.element84.com/v1
resolution = 10
save_dir = L1
anonym = s2_msi
# Set to true to merge all bands into a single multi-band file
merge_outputs = true
include_metadata = true
# Override output format for this section (optional)
# output_format = cog

[S2_L2RGB]
include_bands = TCI_R,TCI_G,TCI_B
stac_endpoints = https://earth-search.aws.element84.com/v1
resolution = 10
save_dir = L2RGB
anonym = s2_msi
merge_outputs = true
include_metadata = false

[S2_L2SURF]
include_bands = B01,B02,B03,B04,B05,B06,B07,B08,B8A,B09,B11,B12
stac_endpoints = https://earth-search.aws.element84.com/v1
include_metadata = true
resolution = 10
save_dir = L2_SURF
anonym = s2_msi
merge_outputs = true

; [LC08_L1TOA]
; include_bands = B1,B2,B3,B4,B5,B6,B7,B8,B9,B10,B11,QA_PIXEL,QA_RADSAT,SAA,SZA,VAA,VZA
